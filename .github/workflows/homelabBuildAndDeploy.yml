name: homelabBuildAndDeploy

on:
  push:
    branches:
      - cid
      - main
    paths:
      - backend/**
      - frontend/**
      - docker/**
      - docker-compose.yml
      - .github/workflows/homelabBuildAndDeploy.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  HOMELABOPS_REPO: ${{ vars.HOMELABOPS_REPO || 'UttU28/homeLabOps' }}
  VITE_API_URL: ${{ vars.VITE_API_URL || 'https://saral.thatinsaneguy.com' }}

jobs:
  detectChanges:
    runs-on: self-hosted
    outputs:
      api: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.api }}
      ui: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.ui }}
      redis: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.redis }}
    steps:
      - name: checkoutApp
        uses: actions/checkout@v4

      - name: detectPathChanges
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'backend/**'
              - 'docker/Dockerfile.api'
            ui:
              - 'frontend/**'
              - 'docker/Dockerfile.frontend'
              - 'docker/nginx.frontend.conf'
            redis:
              - 'docker/Dockerfile.redis'

  buildApi:
    needs: detectChanges
    if: github.event_name == 'workflow_dispatch' || needs.detectChanges.outputs.api == 'true'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkoutApp
        uses: actions/checkout@v4

      - name: loginGhcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: buildAndPush
        run: |
          ownerLower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          shortSha="${GITHUB_SHA::7}"
          image="${{ env.REGISTRY }}/${ownerLower}/saral-api"
          docker build -f docker/Dockerfile.api \
            -t "${image}:${shortSha}" -t "${image}:latest" .
          docker push "${image}:${shortSha}"
          docker push "${image}:latest"

  buildUi:
    needs: detectChanges
    if: github.event_name == 'workflow_dispatch' || needs.detectChanges.outputs.ui == 'true'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkoutApp
        uses: actions/checkout@v4

      - name: loginGhcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: buildAndPush
        run: |
          ownerLower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          shortSha="${GITHUB_SHA::7}"
          image="${{ env.REGISTRY }}/${ownerLower}/saral-ui"
          docker build -f docker/Dockerfile.frontend \
            --build-arg "VITE_API_URL=${{ env.VITE_API_URL }}" \
            -t "${image}:${shortSha}" -t "${image}:latest" .
          docker push "${image}:${shortSha}"
          docker push "${image}:latest"

  buildRedis:
    needs: detectChanges
    if: github.event_name == 'workflow_dispatch' || needs.detectChanges.outputs.redis == 'true'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkoutApp
        uses: actions/checkout@v4

      - name: loginGhcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: buildAndPush
        run: |
          ownerLower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          shortSha="${GITHUB_SHA::7}"
          image="${{ env.REGISTRY }}/${ownerLower}/saral-redis"
          docker build -f docker/Dockerfile.redis \
            -t "${image}:${shortSha}" -t "${image}:latest" .
          docker push "${image}:${shortSha}"
          docker push "${image}:latest"

  bumpGitOps:
    needs: [detectChanges, buildApi, buildUi, buildRedis]
    runs-on: self-hosted
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.buildApi.result == 'success' ||
       needs.buildUi.result == 'success' ||
       needs.buildRedis.result == 'success')
    steps:
      - name: validateGitOpsToken
        env:
          GIT_TOKEN: ${{ secrets.HOMELABOPS_GIT_TOKEN }}
        run: |
          if [ -z "$GIT_TOKEN" ]; then
            echo "::error::Missing HOMELABOPS_GIT_TOKEN — add it under Saral-Job-Viewer → Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: checkoutHomeLabOps
        env:
          GIT_TOKEN: ${{ secrets.HOMELABOPS_GIT_TOKEN }}
        run: |
          git clone "https://x-access-token:${GIT_TOKEN}@github.com/${{ env.HOMELABOPS_REPO }}.git" homeLabOps

      - name: updateImageTags
        working-directory: homeLabOps
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          BUILD_API: ${{ needs.buildApi.result == 'success' }}
          BUILD_UI: ${{ needs.buildUi.result == 'success' }}
          BUILD_REDIS: ${{ needs.buildRedis.result == 'success' }}
        run: |
          ownerLower=$(echo "${IMAGE_OWNER}" | tr '[:upper:]' '[:lower:]')
          shortSha="${GITHUB_SHA::7}"
          kustomization="apps/saralJobViewer/kustomization.yaml"
          bumped=""

          bumpTag() {
            local image="$1"
            awk -v img="ghcr.io/${ownerLower}/${image}" -v tag="${shortSha}" '
              $0 ~ "name: " img { inBlock=1 }
              inBlock && $0 ~ /^[[:space:]]*newTag:/ {
                sub(/newTag:.*/, "newTag: " tag)
                inBlock=0
              }
              { print }
            ' "${kustomization}" > "${kustomization}.tmp"
            mv "${kustomization}.tmp" "${kustomization}"
            bumped="${bumped} ${image}"
          }

          if [ "${BUILD_API}" = "true" ]; then bumpTag "saral-api"; fi
          if [ "${BUILD_UI}" = "true" ]; then bumpTag "saral-ui"; fi
          if [ "${BUILD_REDIS}" = "true" ]; then bumpTag "saral-redis"; fi

          echo "Bumped:${bumped}"
          grep -A1 'name: ghcr.io' "${kustomization}"

      - name: commitAndPush
        working-directory: homeLabOps
        env:
          GIT_TOKEN: ${{ secrets.HOMELABOPS_GIT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GIT_TOKEN}@github.com/${{ env.HOMELABOPS_REPO }}.git"
          git add apps/saralJobViewer/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No tag changes to commit."
            exit 0
          fi
          git commit -m "chore(saral): bump images to ${GITHUB_SHA::7}"
          git push origin HEAD
